[project]
name = "hydra-browser"
version = "0.1.0"
description = "Parallel browser agent: orchestrator + action-capable worker agents with isolated Chromium windows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "playwright>=1.47",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
video = ["pillow>=10"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
hydra = "hydra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
